<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Countries Viewer - 國家資訊查詢系統</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="loadingMessage" class="loading-overlay">資料載入中 (Loading data)...</div>

    <div class="main-container">
        <div class="top-bar">
            <div style="flex: 1; display: flex; justify-content: flex-end; padding-right: 20px;">
                <button id="prevBtn" class="big-btn">◀</button>
            </div>
            <div
                style="width: 550px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;">
                <div id="infoTitle" class="info-title" style="white-space: nowrap;">國家資訊</div>
                <div id="capitalTitle" style="font-size: 1.6rem; margin-top: 5px; color: #bbb; white-space: nowrap;">首都:
                    載入中...</div>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-start; padding-left: 20px;">
                <button id="nextBtn" class="big-btn">▶</button>
            </div>
        </div>

        <!-- Flag Area -->
        <div class="flag-frame">
            <img id="flagImg" src="" alt="Flag" style="display: none;">
            <div id="flagText" class="flag-text">載入中...</div>
        </div>

        <!-- Details Area -->
        <div class="details-frame">
            <div id="areaLabel" class="area-label">領土面積 : </div>
            <div id="populationLabel" class="area-label" style="margin-left: 50px;">國家人口 : </div>
        </div>

        <!-- Range Buttons -->
        <div id="rangeFrame" class="range-frame">
            <!-- Buttons injected here -->
        </div>
    </div>

    <!-- Modal for Range List -->
    <div id="rangeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">國家列表</h3>
                <span id="closeModal" class="close">&times;</span>
            </div>
            <div id="modalList" class="modal-list">
                <!-- List items injected here -->
            </div>
        </div>
    </div>

    <!-- Modal for Search -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>搜尋國家</h3>
                <span id="closeSearchModal" class="close">&times;</span>
            </div>
            <div style="padding: 10px 20px;">
                <input type="text" id="searchInput" placeholder="輸入國家名稱 (中英文皆可)..."
                    style="width: 90%; padding: 10px; font-size: 1.2rem; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div id="searchList" class="modal-list">
                <!-- Search items injected here -->
            </div>
        </div>
    </div>



    <!-- 引入可以讓本地直接讀取的 json 資料變數 -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
